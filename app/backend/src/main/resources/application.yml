server:
  port: 8080

spring:
  application:
    name: qing
  datasource:
    url: jdbc:postgresql://localhost:5432/qing
    username: postgres
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
